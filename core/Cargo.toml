[package]
name = "graph-core"
version = "0.1.0"
edition = "2021"
description = "グラフソフトの計算エンジン（数式の解析・評価・メッシュ生成）"

[lib]
# cdylib: WASM 用 / rlib: `cargo test` 用
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
num-complex = "0.4"
# 大きな整数・分数・高い精度の小数（厳密値の道。計画 docs/plan-exact-core.md の D1。MIT / Apache-2.0）
dashu = { version = "0.6.2", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
# 1 つの単位でまとめて最適化する（ビルドは遅くなるが、WASM が小さく速くなる）
codegen-units = 1
# パニックしたら止める（WASM では巻き戻しができないので、止めるのと同じ。巻き戻しのための表が消えて小さくなる）。
# テストはこの設定を無視して巻き戻す
panic = "abort"
# デバッグ情報を消す。strip = true（関数の名前の表まで消す。WASM がさらに 9% 小さい）は、WASM の機能を書いた区画
# （target_features）も消してしまい、wasm-bindgen が使える機能を判定できなくなる（ビルドで警告が出る）ので使わない
strip = "debuginfo"

# wasm-opt（追加の最適化ツール）はダウンロードに失敗しやすいので、ひとまず無効にしておく
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
